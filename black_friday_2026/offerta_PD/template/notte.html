<!DOCTYPE html>
<html lang="it" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{TITOLO}}</title>
<!--[if !mso]><!-->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&amp;display=swap" rel="stylesheet">
<!--<![endif]-->
<!--[if mso]>
<noscript><xml><o:OfficeDocumentSettings><o:AllowPNG/><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
<style>
  body, table, td, p, a, span, strong, div, center { font-family: Arial, Helvetica, sans-serif !important; }
</style>
<![endif]-->
<style>
  /* Tema "notte": l'email e' scura di suo, come il sito. Nessuna regola dark mode da forzare. */
  body { margin: 0 !important; padding: 0 !important; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table, td { border-collapse: separate; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
  #outlook a { padding: 0; }
  a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }

  @media screen and (max-width: 600px) {
    .container { width: 100% !important; max-width: 100% !important; }
  }
  @media screen and (max-width: 480px) {
    .px { padding-left: 22px !important; padding-right: 22px !important; }
    .h1n { font-size: 36px !important; line-height: 39px !important; letter-spacing: -1.2px !important; }
    .num-n { font-size: 28px !important; line-height: 30px !important; }
    .tk-x { display: none !important; }
    .pill-x { display: none !important; }
    .cf { display: block !important; width: auto !important; }
    .cf-gap { display: block !important; width: 100% !important; height: 12px !important; }
    .cp-n { padding-left: 18px !important; padding-right: 18px !important; }
    .prezzo-n { font-size: 68px !important; letter-spacing: -3px !important; }
    .ps-col { display: block !important; width: 100% !important; padding-bottom: 14px !important; }
    .ps-txt { display: block !important; width: 100% !important; }
    .btn-table { width: 100% !important; }
    .btn-td { width: 100% !important; }
    .btn-a { display: block !important; padding-left: 22px !important; padding-right: 8px !important; }
    .btn-txt { padding-right: 10px !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; width:100%; background-color:{{C_NERO}};">
<div class="preheader" style="display:none; font-size:1px; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all; color:{{C_NERO}};">{{PREHEADER}}{{RIEMPIMENTO}}</div>
<div role="article" aria-roledescription="email" lang="it" style="background-color:{{C_NERO}};">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="{{C_NERO}}" style="width:100%; background-color:{{C_NERO}}; background-image:radial-gradient(circle at 90% 6%, rgba(114,250,147,0.16) 0%, rgba(114,250,147,0) 32%), radial-gradient(circle at 0% 42%, rgba(0,52,111,0.75) 0%, rgba(0,52,111,0) 45%), linear-gradient(180deg, {{C_NERO}} 0%, #001A3D 45%, {{C_NERO}} 100%);">
  <!-- Striscia verde in alto, come la marquee del sito -->
  <tr>
    <td align="center" bgcolor="{{C_VERDE}}" style="padding:10px 12px; background-color:{{C_VERDE}}; font-family:{{FONT}}; font-size:10px; line-height:14px; font-weight:900; letter-spacing:3px; color:{{C_NERO}}; white-space:nowrap;">{{STRISCIA}}</td>
  </tr>
  <tr>
    <td align="center" style="padding:0;">
      <!--[if mso]><table role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px;">
        <!-- Barra alta: logo verde a sinistra, pillola a destra -->
        <tr>
          <td class="px" style="padding:30px 36px 0 36px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
              <tr>
                <td valign="middle" align="left">
                  <img src="{{LOGO_URL}}" width="150" alt="Studio Mobilitas" style="display:block; width:150px; max-width:100%; height:auto; border:0; outline:none; text-decoration:none; font-family:{{FONT}}; font-size:18px; font-weight:700; line-height:1.3; color:#FFFFFF;">
                </td>
                <td class="pill-x" valign="middle" align="right" style="text-align:right;">
                  <span style="display:inline-block; padding:7px 14px; border:1px solid rgba(114,250,147,0.55); border-radius:999px; font-family:{{FONT}}; font-size:10px; line-height:12px; font-weight:800; letter-spacing:2.4px; color:{{C_VERDE}}; white-space:nowrap;">BLACK FRIDAY 2026</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Apertura: titolo enorme e numeri, direttamente sul fondo -->
        <tr>
          <td class="px" align="left" style="padding:54px 36px 0 36px;">
{{TESTATA}}
          </td>
        </tr>
        <!-- Blocchi dell'email -->
        <tr>
          <td class="px" align="left" style="padding:48px 36px 48px 36px;">
<!-- BLOCCHI:INIZIO -->
{{BLOCCHI}}
<!-- BLOCCHI:FINE -->
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td class="px" align="center" style="padding:0 36px 44px 36px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
              <tr><td style="border-top:1px solid rgba(255,255,255,0.10); padding-top:28px;">
{{FOOTER}}
              </td></tr>
            </table>
          </td>
        </tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr>
</table>
</div>
</body>
</html>
