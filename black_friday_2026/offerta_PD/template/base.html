<!DOCTYPE html>
<html lang="it" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{TITOLO}}</title>
<!--[if !mso]><!-->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&amp;display=swap" rel="stylesheet">
<!--<![endif]-->
<!--[if mso]>
<noscript><xml><o:OfficeDocumentSettings><o:AllowPNG/><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
<style>
  body, table, td, p, a, span, strong, div, center { font-family: Arial, Helvetica, sans-serif !important; }
</style>
<![endif]-->
<style>
  /* Reset dei client email */
  body { margin: 0 !important; padding: 0 !important; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table, td { border-collapse: separate; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
  #outlook a { padding: 0; }
  a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }

  /* Telefono */
  @media screen and (max-width: 600px) {
    .container { width: 100% !important; max-width: 100% !important; }
  }
  @media screen and (max-width: 480px) {
    .pad-out { padding: 10px 8px 0 8px !important; }
    .px { padding-left: 22px !important; padding-right: 22px !important; }
    .hero-pad { padding-left: 10px !important; padding-right: 10px !important; }
    .hero-in { padding: 22px 20px 20px 20px !important; }
    .wm-f { font-size: 32px !important; line-height: 35px !important; letter-spacing: -1px !important; }
    .tb-hide-m { display: none !important; }
    .cf { display: block !important; width: auto !important; }
    .cf-gap { display: block !important; width: 100% !important; height: 12px !important; }
    .wm { font-size: 50px !important; line-height: 46px !important; letter-spacing: -2px !important; }
    .col-timbro { width: 100px !important; }
    .timbro { padding: 4px !important; }
    .bollino { width: 84px !important; height: 84px !important; }
    .bollino-t { font-size: 24px !important; line-height: 26px !important; }
    .tb-s { font-size: 7px !important; letter-spacing: 1.5px !important; }
    .dato { font-size: 13px !important; }
    .stack { display: block !important; width: 100% !important; text-align: left !important; }
    .tk-x { display: none !important; }
    .cp { padding-left: 22px !important; padding-right: 22px !important; }
    .ps-col { display: block !important; width: 100% !important; padding-bottom: 14px !important; }
    .ps-txt { display: block !important; width: 100% !important; }
    .prezzo { font-size: 44px !important; line-height: 50px !important; letter-spacing: -1.5px !important; }
    .btn-table { width: 100% !important; }
    .btn-td { width: 100% !important; }
    .btn-a { display: block !important; padding-left: 22px !important; padding-right: 8px !important; }
    .btn-txt { padding-right: 10px !important; }
  }
</style>
<style>
  /* Dark mode (adattamento della versione chiara) */
  @media (prefers-color-scheme: dark) {
    .bg-page { background-color: {{D_PAGINA}} !important; }
    .bg-card { background-color: {{D_CARD}} !important; border-color: {{D_BORDO}} !important; }
    .t-main { color: {{D_TESTO}} !important; }
    .t-sec { color: {{D_SECONDARIO}} !important; }
    .link { color: {{D_TESTO}} !important; }
    .cp-top { background-image: linear-gradient(160deg, #123F78 0%, {{D_RIQUADRO}} 100%) !important; }
    .card-motivi { background-color: {{D_RIQUADRO}} !important; border-color: {{D_BORDO}} !important; }
    .card-passi { background-color: {{D_RIQUADRO}} !important; }
    .sep { border-top-color: {{D_BORDO}} !important; }
    .card-box { background-color: {{D_RIQUADRO}} !important; border-color: {{D_BORDO}} !important; }
    .cp-chiaro { background-color: {{D_RIQUADRO}} !important; }
    .pall-pag { border-color: {{D_TESTO}} !important; }
    .num-ghost { color: {{D_BORDO}} !important; }
    .ps-box { background-color: {{D_RIQUADRO}} !important; background-image: none !important; border-color: {{D_BORDO}} !important; }
    .ps-sigla { background-color: {{D_CARD}} !important; }
    .btn-td { background-color: {{C_VERDE}} !important; }
    .btn-a { color: {{C_NOTTE}} !important; }
    .logo-light { display: none !important; }
    .logo-dark { display: block !important; max-height: none !important; overflow: visible !important; }
  }
  /* Outlook.com */
  [data-ogsb] .bg-page { background-color: {{D_PAGINA}} !important; }
  [data-ogsb] .bg-card { background-color: {{D_CARD}} !important; }
  [data-ogsb] .card-box, [data-ogsb] .cp-chiaro, [data-ogsb] .card-motivi, [data-ogsb] .card-passi { background-color: {{D_RIQUADRO}} !important; }
  [data-ogsb] .ps-box { background-color: {{D_RIQUADRO}} !important; }
  [data-ogsb] .btn-td { background-color: {{C_VERDE}} !important; }
  [data-ogsc] .t-main { color: {{D_TESTO}} !important; }
  [data-ogsc] .t-sec { color: {{D_SECONDARIO}} !important; }
  [data-ogsc] .link { color: {{D_TESTO}} !important; }
  [data-ogsc] .btn-a { color: {{C_NOTTE}} !important; }
  [data-ogsc] .logo-light { display: none !important; }
  [data-ogsc] .logo-dark { display: block !important; max-height: none !important; overflow: visible !important; }
</style>
</head>
<body class="bg-page" style="margin:0; padding:0; width:100%; background-color:{{C_PAGINA}};">
<div class="preheader" style="display:none; font-size:1px; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all; color:{{C_PAGINA}};">{{PREHEADER}}{{RIEMPIMENTO}}</div>
<div role="article" aria-roledescription="email" lang="it" class="bg-page" style="background-color:{{C_PAGINA}};">
<table role="presentation" class="bg-page" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; background-color:{{C_PAGINA}};">
  <tr>
    <td class="pad-out" align="center" style="padding:28px 12px 0 12px;">
      <!--[if mso]><table role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <!-- Card dell'email -->
      <table role="presentation" class="container bg-card" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="{{C_BIANCO}}" style="width:100%; max-width:600px; background-color:{{C_BIANCO}}; border:1px solid {{C_BORDO}}; border-radius:22px; box-shadow:0 18px 50px rgba(0,37,82,0.10);">
        <!-- Logo -->
        <tr>
          <td class="px" align="center" style="padding:30px 36px 22px 36px;">
            <img class="logo-light" src="{{LOGO_URL}}" width="{{LOGO_LARGHEZZA}}" alt="Studio Mobilitas" style="display:block; margin:0 auto; width:{{LOGO_LARGHEZZA}}px; max-width:100%; height:auto; border:0; outline:none; text-decoration:none; font-family:{{FONT}}; font-size:18px; font-weight:700; line-height:1.3; color:{{C_NOTTE}};">
            {{LOGO_DARK}}
          </td>
        </tr>
        <!-- Testata Black Friday -->
        <tr>
          <td class="hero-pad" style="padding:0 16px;">
{{TESTATA}}
          </td>
        </tr>
        <!-- Blocchi dell'email -->
        <tr>
          <td class="px" align="left" style="padding:36px 40px 40px 40px;">
<!-- BLOCCHI:INIZIO -->
{{BLOCCHI}}
<!-- BLOCCHI:FINE -->
          </td>
        </tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr>
  <!-- Footer -->
  <tr>
    <td align="center" style="padding:28px 24px 40px 24px;">
      <!--[if mso]><table role="presentation" width="520" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table role="presentation" class="container" width="520" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:520px;">
        <tr>
          <td align="center" style="padding:0;">
{{FOOTER}}
          </td>
        </tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr>
</table>
</div>
</body>
</html>
