<style>

  #outlook a { padding: 0; }
  a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }

  @media screen and (max-width: 600px) {
    .container { width: 100% !important; max-width: 100% !important; }
  }
  @media screen and (max-width: 480px) {

    .h1f { font-size: 36px !important; line-height: 40px !important; letter-spacing: -1.2px !important; }
    .sx { display: block !important; width: 100% !important; border-left: 0 !important; padding: 0 0 16px 0 !important; }
    .cp-s { padding: 22px 20px 22px 20px !important; }
    .tl { padding-left: 2px !important; padding-right: 2px !important; }
    .tl-t { font-size: 12px !important; line-height: 16px !important; }
    .bn-c { display: block !important; width: 100% !important; padding: 0 !important; }
    .bn-r { border-left: 0 !important; padding-top: 14px !important; }
    .bn-pct { font-size: 80px !important; line-height: 80px !important; letter-spacing: -4px !important; }
    .bn-in { padding: 24px 22px 22px 22px !important; }

    .pz-v { font-size: 34px !important; line-height: 36px !important; letter-spacing: -1.2px !important; }
    .pz-o { font-size: 26px !important; line-height: 30px !important; }
    .pz-t { padding: 14px 6px !important; }
    .ck-t { font-size: 54px !important; line-height: 58px !important; padding: 8px 12px !important; }
    .ck-p { font-size: 44px !important; line-height: 46px !important; padding: 0 6px !important; }
    .h1n { font-size: 36px !important; line-height: 39px !important; letter-spacing: -1.2px !important; }
    .num-n { font-size: 28px !important; line-height: 30px !important; }

    .pill-x { display: none !important; }

<body style="margin:0; padding:0; width:100%; background-color:{{C_BIANCO}};">
<div class="preheader" style="display:none; font-size:1px; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all; color:{{C_BIANCO}};">{{PREHEADER}}{{RIEMPIMENTO}}</div>
<div role="article" aria-roledescription="email" lang="it" style="background-color:{{C_BIANCO}};">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="{{C_BIANCO}}" style="width:100%; background-color:{{C_BIANCO}};">
  <!-- Fascia Black Friday in alto (vuota quando c'e' il banner) -->
  {{FASCIA_RIGA}}
  <tr>
    <td align="center" style="padding:0;">
      <!--[if mso]><table role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px;">
        <!-- Logo centrato, come nella barra del sito -->
        <tr>
          <td class="px" align="center" style="padding:30px 36px 0 36px;">
            <img src="{{LOGO_URL}}" width="160" alt="Studio Mobilitas" style="display:block; margin:0 auto; width:160px; max-width:100%; height:auto; border:0; outline:none; text-decoration:none; font-family:{{FONT}}; font-size:18px; font-weight:700; line-height:1.3; color:{{C_NOTTE}};">
          </td>
        </tr>
        <!-- Apertura centrata: pillola, etichetta, titolo, barra di avanzamento, tessere dei numeri -->
        <tr>
          <td class="px" align="center" style="padding:40px 36px 0 36px;">
{{TESTATA}}
          </td>
        </tr>
        <!-- Blocchi dell'email -->
        <tr>
          <td class="px" align="left" style="padding:48px 36px 48px 36px;">
<!-- BLOCCHI:INIZIO -->
{{BLOCCHI}}
<!-- BLOCCHI:FINE -->
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td class="px" align="center" style="padding:0 36px 44px 36px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
              <tr><td style="border-top:1px solid #E3E8EF; padding-top:28px;">
{{FOOTER}}
              </td></tr>
            </table>
          </td>
        </tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr>
</table>
</div>
